<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>QR Code โหมดทดลอง — สหกรณ์โรงเรียน</title>
<style>
  body {
    font-family: 'Prompt', sans-serif;
    background: #FFFBF3;
    color: #2C1810;
    margin: 0; padding: 40px 20px;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { color: #2D7D6F; margin-bottom: 8px; }
  .sub { color: #6B5D45; margin-bottom: 32px; }
  .card {
    background: white;
    border: 3px solid #2D7D6F;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 420px;
    width: 100%;
  }
  .qr-wrap {
    background: white;
    padding: 16px;
    border-radius: 16px;
    display: inline-block;
    margin: 16px 0;
  }
  #qrcode img { display: block; }
  .url {
    font-family: monospace;
    font-size: 12px;
    background: #F5EAD3;
    padding: 8px 12px;
    border-radius: 8px;
    word-break: break-all;
    margin: 12px 0;
    color: #2D7D6F;
    font-weight: 700;
  }
  .badge {
    display: inline-block;
    background: linear-gradient(90deg, #F4A82E, #E89A0E);
    color: white;
    padding: 6px 14px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .features {
    text-align: left;
    margin-top: 20px;
    padding: 16px;
    background: #FFF8EE;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.8;
  }
  .features b { color: #2D7D6F; }
  .controls {
    margin-top: 24px;
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  input[type="text"] {
    border: 2px solid #E8D6B3;
    padding: 10px 14px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 12px;
  }
  button {
    background: #2D7D6F;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #226258; }
  .print-hint {
    margin-top: 20px;
    font-size: 12px;
    color: #6B5D45;
  }
  @media print {
    body { background: white; padding: 0; }
    .controls, .print-hint, h1 + .sub { display: none; }
    .card { border: none; box-shadow: none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>

<h1>📱 QR Code โหมดทดลอง</h1>
<div class="sub">สำหรับติดโปสเตอร์งานประกวด</div>

<div class="card">
  <div class="badge">🎭 โหมดทดลอง — ไม่ต้องลงทะเบียน</div>

  <div>
    <input type="text" id="baseUrl" placeholder="https://your-app.vercel.app">
    <button onclick="genQR()">สร้าง QR Code</button>
  </div>

  <div class="qr-wrap" id="qrcode"></div>

  <div class="url" id="urlDisplay">—</div>

  <div class="features">
    🎯 <b>สแกนแล้วลองใช้ได้เลย</b><br>
    ⚡ ไม่ต้องสมัครสมาชิก<br>
    📦 มีข้อมูลตัวอย่างพร้อมเล่น<br>
    🔄 รีเฟรชเพื่อรีเซ็ต<br>
    ☁ ไม่กระทบข้อมูลจริง
  </div>

  <div class="controls">
    <button onclick="window.print()">🖨 พิมพ์</button>
    <button onclick="downloadQR()">💾 ดาวน์โหลด QR</button>
  </div>

  <div class="print-hint">💡 พิมพ์ขนาด A5 ใส่ในโปสเตอร์ หรือพิมพ์ใหญ่กว่าใส่บอร์ดได้</div>
</div>

<script>
  // ตั้งค่าเริ่มต้น — auto detect domain
  document.getElementById('baseUrl').value = location.origin + location.pathname.replace('demo-qr.html', '');

  function getDemoUrl() {
    let url = document.getElementById('baseUrl').value.trim();
    if (!url) return '';
    url = url.replace(/\/+$/, '');  // remove trailing /
    return url + '/?demo=1';
  }

  function genQR() {
    const url = getDemoUrl();
    if (!url) { alert('กรุณาใส่ URL'); return; }
    document.getElementById('urlDisplay').textContent = url;
    const wrap = document.getElementById('qrcode');
    wrap.innerHTML = '';
    QRCode.toCanvas(url, { width: 320, margin: 1, color: { dark: '#2D7D6F', light: '#FFFFFF' } }, function (err, canvas) {
      if (err) { wrap.textContent = 'สร้าง QR ไม่สำเร็จ'; return; }
      wrap.appendChild(canvas);
    });
  }

  function downloadQR() {
    const canvas = document.querySelector('#qrcode canvas');
    if (!canvas) { alert('สร้าง QR ก่อน'); return; }
    const a = document.createElement('a');
    a.download = 'demo-qr.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  // Auto-generate on load
  genQR();
</script>

</body>
</html>
