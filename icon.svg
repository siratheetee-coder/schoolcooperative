<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#46A697"/>
      <stop offset="60%" stop-color="#2D7D6F"/>
      <stop offset="100%" stop-color="#174740"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#FFB627"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#glow)"/>

  <!-- gold accent circle behind school -->
  <circle cx="256" cy="240" r="140" fill="url(#gold)" opacity="0.95"/>
  <circle cx="256" cy="240" r="140" fill="none" stroke="#E89A0E" stroke-width="6" opacity="0.5"/>

  <!-- school building (simplified) -->
  <g transform="translate(256,240)">
    <!-- roof -->
    <polygon points="-90,-30 0,-90 90,-30" fill="#226258"/>
    <!-- bell tower -->
    <rect x="-15" y="-100" width="30" height="20" fill="#FFB627"/>
    <circle cx="0" cy="-105" r="6" fill="#174740"/>
    <!-- main body -->
    <rect x="-90" y="-30" width="180" height="90" fill="#FFFBF3" stroke="#226258" stroke-width="4"/>
    <!-- door -->
    <rect x="-22" y="10" width="44" height="50" fill="#226258" rx="22 22 0 0"/>
    <circle cx="15" cy="38" r="3" fill="#FFB627"/>
    <!-- windows -->
    <rect x="-70" y="-10" width="30" height="25" fill="#7AB8E0" stroke="#226258" stroke-width="3"/>
    <rect x="40" y="-10" width="30" height="25" fill="#7AB8E0" stroke="#226258" stroke-width="3"/>
    <!-- flag pole -->
    <line x1="0" y1="-90" x2="0" y2="-115" stroke="#226258" stroke-width="3"/>
    <polygon points="0,-115 16,-110 0,-103" fill="#E0594A"/>
  </g>

  <!-- coin badge -->
  <g transform="translate(380,380)">
    <circle r="58" fill="url(#gold)" stroke="#E89A0E" stroke-width="4"/>
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="#174740" text-anchor="middle">฿</text>
  </g>
</svg>
